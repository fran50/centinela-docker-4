services:
  mongodb:
    image: mongo:8.0
    container_name: centinela-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password123}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "${MONGO_ROOT_USERNAME:-root}", "--password", "${MONGO_ROOT_PASSWORD:-password123}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend
    container_name: centinela-backend
    restart: unless-stopped
    environment:
      MQTT_BROKER: ${MQTT_BROKER:-mqtt://host.docker.internal:1883}
      MQTT_TOPIC: ${MQTT_TOPIC:-casa/estacion}
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-root}:${MONGO_ROOT_PASSWORD:-password123}@mongodb:27017/?authSource=admin
      MONGODB_DB: ${MONGODB_DB:-estacion_meteorologica}
      RAW_COLLECTION: mediciones_raw
      MINUTE_COLLECTION: series_minuto
      HOUR_COLLECTION: series_hora
      DAY_COLLECTION: series_dia
      PREDICTIONS_COLLECTION: predicciones
      STATION_ID: ${STATION_ID:-estacion-001}
      LOCATION_ID: ${LOCATION_ID:-talavera-01}
      TIME_ZONE: ${TIME_ZONE:-Europe/Madrid}
      SAMPLE_INTERVAL_SECONDS: ${SAMPLE_INTERVAL_SECONDS:-3}
      HTTP_PORT: 3001
      WS_HOST: 0.0.0.0
      WS_PORT: 8080
      WS_PATH: /meteo
      AGGREGATION_GRACE_SECONDS: ${AGGREGATION_GRACE_SECONDS:-8}
      MAX_API_POINTS: ${MAX_API_POINTS:-5000}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-cambia-esta-clave}
      CORS_ORIGIN: http://${PUBLIC_HOST:-localhost}:${FRONTEND_PORT:-8088}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-3001}:3001"
      - "${WS_PORT:-8080}:8080"
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_METEO_API_URL: http://${PUBLIC_HOST:-localhost}:${API_PORT:-3001}
        VITE_METEO_WS_URL: ws://${PUBLIC_HOST:-localhost}:${WS_PORT:-8080}/meteo
    container_name: centinela-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongodb_data:
